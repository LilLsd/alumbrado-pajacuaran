<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presidencia Municipal - Pajacuarán 2024-2027</title>
  <style>
    :root {
      --azul-gobierno: #002B49;
      --dorado-gobierno: #C59B27;
      --guinda-gobierno: #7B1E34;
      --fondo-claro: #F4F6F9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #001A2C 0%, var(--azul-gobierno) 60%, var(--guinda-gobierno) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .portal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      border-top: 6px solid var(--dorado-gobierno);
    }

    .escudo-box {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .header-gobierno h2 {
      font-size: 0.9rem;
      color: var(--azul-gobierno);
      letter-spacing: 1.5px;
      font-weight: 800;
    }

    .header-gobierno .periodo {
      font-size: 0.85rem;
      color: var(--guinda-gobierno);
      font-weight: 700;
      margin-top: 2px;
    }

    .divisor {
      height: 3px;
      width: 50px;
      background: var(--dorado-gobierno);
      margin: 15px auto;
      border-radius: 2px;
    }

    .header-gobierno h1 {
      font-size: 1.25rem;
      color: #222;
      margin-bottom: 5px;
    }

    .subtitulo {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 30px;
    }

    .menu-opciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-opcion {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-principal {
      background: var(--azul-gobierno);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 43, 73, 0.3);
      border: 2px solid var(--azul-gobierno);
    }

    .btn-principal:hover {
      background: #00406c;
      transform: translateY(-2px);
    }

    .btn-secundario {
      background: #f8f9fa;
      color: var(--azul-gobierno);
      border: 1.5px solid #dcdcdc;
    }

    .btn-secundario:hover {
      background: #eef2f5;
      transform: translateY(-1px);
    }

    .footer-portal {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="escudo-box">🏛️</div>

    <div class="header-gobierno">
      <h2>H. AYUNTAMIENTO DE PAJACUARÁN</h2>
      <p class="periodo">Gobierno Municipal 2024 - 2027</p>
      <div class="divisor"></div>
      <h1>Plataforma Digital de Servicios Municipales</h1>
      <p class="subtitulo">Dirección de Obras y Servicios Públicos</p>
    </div>

    <div class="menu-opciones">
      <!-- Este enlace nos manda directo al sistema de mapa GIS existente -->
      <a href="/index.html" class="btn-opcion btn-principal">
        🗺️ Mapa GIS de Alumbrado Público
      </a>

      <a href="/index.html" class="btn-opcion btn-secundario">
        📋 Módulo de Reportes de Incidencias
      </a>
    </div>

    <div class="footer-portal">
      © 2024 - 2027 H. Ayuntamiento Constitucional de Pajacuarán, Michoacán.
    </div>
  </div>

</body>
</html>
